<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SFS Space Survival</title>



<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>SFS Space Survival</title>



<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#03040b;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.game{
  width:100%;
  max-width:430px;
  text-align:center;
  padding:10px;
}

.logo{
  font-size:34px;
  font-weight:bold;
  letter-spacing:7px;
}

.subtitle{
  font-size:10px;
  letter-spacing:5px;
  opacity:.5;
  margin-bottom:10px;
}

.info{
  display:flex;
  justify-content:space-around;
  background:#101522;
  padding:10px;
  border-radius:14px;
  margin-bottom:8px;
  font-size:13px;
}

.space{
  position:relative;
}

canvas{
  display:block;
  width:100%;
  max-width:400px;
  margin:auto;
  border-radius:20px;
  background:#02030a;
  border:1px solid #252b45;
}

/* START SCREEN */

.startScreen{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  border-radius:20px;
  background:rgba(2,3,10,.72);
}

.startScreen h2{
  font-size:28px;
  letter-spacing:3px;
  margin-bottom:20px;
}

.startBtn{
  border:0;
  padding:15px 50px;
  border-radius:50px;
  background:linear-gradient(135deg,#7b2cff,#00c6ff);
  color:white;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 8px 25px rgba(0,180,255,.25);
  cursor:pointer;
}

.startBtn:active{
  transform:scale(.94);
}

/* CONTROL BUTTONS */

.controls{
  display:flex;
  justify-content:center;
  gap:30px;
  margin-top:4px;
  transform:translateY(-3px);
}

.control{
  width:80px;
  height:48px;
  border:1px solid #30364e;
  border-radius:15px;
  background:#111625;
  color:white;
  font-size:24px;
  touch-action:none;
  user-select:none;
}

.control:active{
  background:#26304a;
  transform:scale(.94);
}

.tip{
  margin-top:3px;
  font-size:10px;
  opacity:.45;
}
</style>
</head>

<body>

<div class="game">

  <div class="logo">SFS</div>
  <div class="subtitle">SPACE SURVIVAL</div>

  <div class="info">
    <div>Score: <b id="score">0</b></div>
    <div>Time: <b id="time">0</b></div>
    <div>Best: <b id="best">0</b></div>
  </div>

  <div class="space">

    <canvas id="canvas" width="400" height="600"></canvas>

    <!-- CENTER START BUTTON -->
    <div class="startScreen" id="startScreen">
      <h2 id="title">SFS SPACE</h2>
      <button class="startBtn" onclick="startGame()">START</button>
    </div>

  </div>

  <!-- LEFT / RIGHT CONTROLS -->
  <div class="controls">

    <button class="control" id="left">
      ◀
    </button>

    <button class="control" id="right">
      ▶
    </button>

  </div>

  <div class="tip">
    Avoid the meteors • PC: ← → • Mobile: touch buttons
  </div>

</div>


<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let player;

let meteors=[];
let stars=[];
let particles=[];

let score=0;
let time=0;
let best=localStorage.getItem("sfsSpaceBest") || 0;

let running=false;
let frame=0;
let difficulty=1;

let keys={
  left:false,
  right:false
};

document.getElementById("best").textContent=best;


/* =========================
   STARS
========================= */

for(let i=0;i<100;i++){

  stars.push({
    x:Math.random()*400,
    y:Math.random()*600,
    size:Math.random()*2+0.5,
    speed:Math.random()*1.5+0.3
  });

}


/* =========================
   PLAYER
========================= */

function resetPlayer(){

  player={
    x:180,
    y:500,
    w:40,
    h:55,
    speed:6
  };

}


/* =========================
   DRAW STARS
========================= */

function drawStars(){

  ctx.fillStyle="white";

  stars.forEach(s=>{

    ctx.globalAlpha=Math.random()*.7+.3;

    ctx.fillRect(
      s.x,
      s.y,
      s.size,
      s.size
    );

    s.y+=s.speed;

    if(s.y>600){

      s.y=-5;
      s.x=Math.random()*400;

    }

  });

  ctx.globalAlpha=1;

}


/* =========================
   DRAW SPACESHIP
========================= */

function drawPlayer(){

  ctx.save();

  ctx.translate(
    player.x+20,
    player.y+25
  );

  /* Glow */

  ctx.shadowBlur=20;
  ctx.shadowColor="#00c6ff";

  /* Body */

  ctx.fillStyle="#00bfff";

  ctx.beginPath();

  ctx.moveTo(0,-27);
  ctx.lineTo(-19,22);
  ctx.lineTo(0,14);
  ctx.lineTo(19,22);

  ctx.closePath();

  ctx.fill();

  ctx.shadowBlur=0;

  /* Cockpit */

  ctx.fillStyle="#d8f7ff";

  ctx.beginPath();

  ctx.arc(
    0,
    -7,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* Engine */

  ctx.fillStyle="#ff8c00";

  ctx.beginPath();

  ctx.moveTo(-6,18);
  ctx.lineTo(0,34);
  ctx.lineTo(6,18);

  ctx.closePath();

  ctx.fill();

  ctx.restore();

}


/* =========================
   CREATE METEOR
========================= */

function createMeteor(){

  let size=Math.random()*28+22;

  meteors.push({

    x:Math.random()*(400-size),

    y:-size,

    size:size,

    speed:2+difficulty*.45,

    rotation:Math.random()*6

  });

}


/* =========================
   DRAW METEOR
========================= */

function drawMeteor(m){

  ctx.save();

  ctx.translate(
    m.x+m.size/2,
    m.y+m.size/2
  );

  ctx.rotate(m.rotation);

  ctx.fillStyle="#777";

  ctx.beginPath();

  let r=m.size/2;

  for(let i=0;i<8;i++){

    let angle=i*Math.PI/4;

    let radius=
      r*(.8+Math.random()*.25);

    let x=Math.cos(angle)*radius;
    let y=Math.sin(angle)*radius;

    if(i===0)
      ctx.moveTo(x,y);
    else
      ctx.lineTo(x,y);

  }

  ctx.closePath();
  ctx.fill();


  /* Craters */

  ctx.fillStyle="#444";

  ctx.beginPath();

  ctx.arc(
    -5,
    -4,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    6,
    7,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* =========================
   EXPLOSION
========================= */

function explosion(x,y){

  for(let i=0;i<25;i++){

    particles.push({

      x:x,
      y:y,

      dx:(Math.random()-.5)*8,
      dy:(Math.random()-.5)*8,

      life:30

    });

  }

}


/* =========================
   PARTICLES
========================= */

function drawParticles(){

  particles.forEach((p,i)=>{

    p.x+=p.dx;
    p.y+=p.dy;
    p.life--;

    ctx.fillStyle="#ffb000";

    ctx.fillRect(
      p.x,
      p.y,
      4,
      4
    );

    if(p.life<=0){

      particles.splice(i,1);

    }

  });

}


/* =========================
   COLLISION
========================= */

function collision(a,m){

  let px=a.x+20;
  let py=a.y+27;

  let mx=m.x+m.size/2;
  let my=m.y+m.size/2;

  let dx=px-mx;
  let dy=py-my;

  let distance=
    Math.sqrt(dx*dx+dy*dy);

  return distance<
    m.size/2+16;

}


/* =========================
   GAME LOOP
========================= */

function update(){

  if(!running)return;

  ctx.clearRect(
    0,
    0,
    400,
    600
  );

  drawStars();


  /* PLAYER MOVE */

  if(keys.left){

    player.x-=player.speed;

  }

  if(keys.right){

    player.x+=player.speed;

  }


  /* LIMIT */

  if(player.x<0){

    player.x=0;

  }

  if(player.x>360){

    player.x=360;

  }


  /* CREATE METEOR */

  frame++;

  if(frame>45-difficulty*2){

    createMeteor();

    frame=0;

  }


  /* METEORS */

  meteors.forEach((m,i)=>{

    m.y+=m.speed;

    m.rotation+=.02;

    drawMeteor(m);


    if(m.y>610){

      meteors.splice(i,1);

      score++;

      document.getElementById(
        "score"
      ).textContent=score;

    }


    if(collision(player,m)){

      explosion(
        player.x+20,
        player.y+27
      );

      gameOver();

    }

  });


  /* DIFFICULTY */

  difficulty=
    1+Math.floor(score/15);

  time=
    Math.floor(score/2);

  document.getElementById(
    "time"
  ).textContent=time;


  drawPlayer();

  drawParticles();


  requestAnimationFrame(update);

}


/* =========================
   START GAME
========================= */

function startGame(){

  score=0;
  time=0;
  frame=0;
  difficulty=1;

  meteors=[];
  particles=[];

  resetPlayer();


  document.getElementById(
    "score"
  ).textContent=0;

  document.getElementById(
    "time"
  ).textContent=0;


  document.getElementById(
    "title"
  ).textContent="SFS SPACE";


  document.querySelector(
    ".startBtn"
  ).textContent="START";


  running=true;


  document.getElementById(
    "startScreen"
  ).style.display="none";


  update();

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

  running=false;


  if(score>best){

    best=score;

    localStorage.setItem(
      "sfsSpaceBest",
      best
    );

    document.getElementById(
      "best"
    ).textContent=best;

  }


  document.getElementById(
    "title"
  ).textContent="GAME OVER";


  document.querySelector(
    ".startBtn"
  ).textContent="RESTART";


  document.getElementById(
    "startScreen"
  ).style.display="flex";

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft"){

      keys.left=true;

    }

    if(e.key==="ArrowRight"){

      keys.right=true;

    }

  }
);


document.addEventListener(
  "keyup",
  e=>{

    if(e.key==="ArrowLeft"){

      keys.left=false;

    }

    if(e.key==="ArrowRight"){

      keys.right=false;

    }

  }
);


/* =========================
   MOBILE LEFT
========================= */

const left=
  document.getElementById("left");

const right=
  document.getElementById("right");


left.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    keys.left=true;

  },
  {passive:false}
);


left.addEventListener(
  "touchend",
  e=>{

    e.preventDefault();

    keys.left=false;

  },
  {passive:false}
);


/* =========================
   MOBILE RIGHT
========================= */

right.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    keys.right=true;

  },
  {passive:false}
);


right.addEventListener(
  "touchend",
  e=>{

    e.preventDefault();

    keys.right=false;

  },
  {passive:false}
);


/* =========================
   MOUSE CONTROLS
========================= */

left.addEventListener(
  "mousedown",
  ()=>{
    keys.left=true;
  }
);

left.addEventListener(
  "mouseup",
  ()=>{
    keys.left=false;
  }
);

right.addEventListener(
  "mousedown",
  ()=>{
    keys.right=true;
  }
);

right.addEventListener(
  "mouseup",
  ()=>{
    keys.right=false;
  }
);


/* INITIAL */

resetPlayer();

</script>

</body>
</html>
